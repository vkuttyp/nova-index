# Checks every entry against its commit (docs/tooling.md §4.8 in the Nova repository).
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  index-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: index
      - uses: actions/checkout@v4
        with:
          repository: vkuttyp/Nova
          path: nova
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build novac
        run: dotnet build nova/src/Nova.Cli -c Release -v quiet
      - name: novac index-check
        run: nova/src/Nova.Cli/bin/Release/net10.0/novac index-check index
